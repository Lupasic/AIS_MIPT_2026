[workspace]
authors = ["Lupasic <obulichev@yandex.ru>"]
channels = ["conda-forge"]
name = "extra_materials"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]

[dependencies]
clearml = ">=2.1.3,<3"
datasets = ">=4.6.1,<5"
huggingface_hub = ">=1.6.0,<2"
kagglehub = ">=1.0.0,<2"
notebook = ">=7.5.4,<8"
ultralytics = ">=8.4.21,<9"
transformers = ">=5.3.0,<6"
torchvision = ">=0.25.0,<0.26"
scikit-learn = ">=1.8.0,<2"
pillow = ">=12.1.1,<13"
matplotlib = ">=3.10.8,<4"
pillow-heif = ">=1.3.0,<2"
ipywidgets = ">=8.1.8,<9"
lightning = ">=2.6.1,<3"

[pypi-dependencies]
pi-heif = ">=1.3.0, <2"

[feature.gpu.system-requirements]
cuda = "12.0"

[feature.gpu.dependencies]
cuda-version = "12.*"
pytorch-gpu = "*"

[feature.cpu.dependencies]
pytorch-cpu = "*"

[environments]
cpu = ["cpu"]
default = ["gpu"]